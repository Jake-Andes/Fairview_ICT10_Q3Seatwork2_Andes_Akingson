<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Intramurals — OBMC</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root{
          
            --bg: #e9ecef;              
            --card: #fff7f0;            
            --accent: #d4a24a;         
            --accent-600: #ad8030;     
            --muted: #394141;          
            --soft-border: rgba(88,64,45,0.14);
            --shadow: 0 18px 40px rgba(30,35,40,0.09);
            --success: #2f8f5a;
            --input-bg: #fffaf6;
        }

        html,body{height:100%; margin:0}
        body{
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            background: linear-gradient(180deg,var(--bg),#f6f4f2);
            color: var(--muted);
            -webkit-font-smoothing:antialiased;
            padding: 48px 20px;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .card-center{
            width:100%;
            max-width:920px;
            background:var(--card);
            border-radius:14px;
            box-shadow: var(--shadow);
            border:1px solid var(--soft-border);
            overflow:hidden;
        }

        .card-header{
            display:flex;
            align-items:center;
            gap:14px;
            padding:20px 26px;
            background:linear-gradient(90deg, rgba(212,162,74,0.12), rgba(212,162,74,0.02));
        }
        .brand {
            width:56px;
            height:56px;
            border-radius:10px;
            background:linear-gradient(135deg,#fff0d9,#f2d19a);
            display:flex;
            align-items:center;
            justify-content:center;
            font-weight:800;
            color:#6b4322;
            box-shadow: 0 8px 24px rgba(30,35,40,0.06);
            border:1px solid rgba(0,0,0,0.04);
        }
        .title-wrap { flex:1; }
        .card-title {
            margin:0;
            font-size:18px;
            color:#6b4322;
            font-weight:700;
        }
        .card-sub { margin:4px 0 0; font-size:13px; color:var(--muted); }

        .card-body {
            padding:26px;
        }

        .grid {
            display:grid;
            grid-template-columns: 1fr 1fr;
            gap:18px;
        }

     
        .choice {
            background:#fff8f2;
            border-radius:12px;
            border:1px solid rgba(120,90,60,0.06);
            padding:14px;
            text-align:center;
        }
        .choice label { display:inline-flex; gap:8px; align-items:center; cursor:pointer; color:#5b4127; font-weight:700; }
        .choice input { transform:scale(1.03); accent-color: var(--accent-600); }

        
        .select-wrap {
            display:flex;
            flex-direction:column;
            gap:12px;
        }
        select.form-control {
            border-radius:10px;
            padding:10px 12px;
            border:1px solid rgba(120,90,60,0.12);
            height:48px;
            background:var(--input-bg);
            color:#2e2e2e;
            text-align:center;
        }

        .actions { display:flex; gap:12px; align-items:center; justify-content:center; margin-top:18px; }
        .btn-gold {
            background:var(--accent);
            color:#3b2a1a;
            border:0;
            padding:10px 20px;
            border-radius:10px;
            font-weight:800;
            box-shadow:0 10px 26px rgba(80,50,20,0.07);
        }
        .btn-gold:active { transform:translateY(1px); }
        .btn-clear {
            background:transparent;
            border:1px solid rgba(120,90,60,0.08);
            padding:10px 18px;
            border-radius:10px;
            color:var(--muted);
        }

        .card-footer {
            padding:18px 26px;
            border-top:1px solid rgba(120,90,60,0.06);
            background: linear-gradient(180deg, rgba(250,246,240,0.9), transparent);
        }

        #output1 {
            display:flex;
            gap:18px;
            align-items:center;
            justify-content:flex-start;
            flex-wrap:wrap;
        }

        #output1 .team-img {
            width:160px;
            height:96px;
            object-fit:cover;
            border-radius:10px;
            border:1px solid rgba(34,41,47,0.06);
            background:#f6f6f6;
        }

        #output1 .text {
            min-width:260px;
        }
        #output1 .text h4 {
            margin:0 0 6px 0;
            color:#52351f;
            font-size:16px;
        }
        #output1 .text p { margin:0; color:var(--muted); font-size:14px; }

        @media (max-width:800px){
            .grid { grid-template-columns: 1fr; }
            .card-body { padding:18px; }
            .card-header { padding:14px 18px; gap:10px; }
        }
    </style>
</head>
<body>

    <div class="card-center">
        <div class="card-header">
            <div class="title-wrap">
                <h3 class="card-title">Intramurals Team Checker</h3>
                <div class="card-sub">Quickly check eligibility and assigned team</div>
            </div>
        </div>

        <div class="card-body">
            <form>
                <div class="grid">
                    <div>
                        <div class="choice mb-3">
                            <div style="font-weight:700;color:#5b4127;margin-bottom:8px;">Clinic Slip</div>
                            <label><input type="radio" id="clinic-yes" name="clinic" value="yes" checked> Yes</label>
                            <label style="margin-left:12px;"><input type="radio" id="clinic-no" name="clinic" value="no"> No</label>
                        </div>

                        <div class="choice">
                            <div style="font-weight:700;color:#5b4127;margin-bottom:8px;">Online Registration</div>
                            <label><input type="radio" id="online-yes" name="online" value="yes" checked> Yes</label>
                            <label style="margin-left:12px;"><input type="radio" id="online-no" name="online" value="no"> No</label>
                        </div>
                    </div>

                    <div class="select-wrap">
                        <div>
                            <label style="display:block;margin-bottom:8px;color:#5b4127;font-weight:700;">Grade level</label>
                            <select id="num1" class="form-control" aria-label="Grade level">
                                <option value="" disabled selected>Select Grade level</option>
                                <option value="7">Grade 7</option>
                                <option value="8">Grade 8</option>
                                <option value="9">Grade 9</option>
                                <option value="10">Grade 10</option>
                            </select>
                        </div>

                        <div>
                            <label style="display:block;margin-bottom:8px;color:#5b4127;font-weight:700;">Section</label>
                            <select id="num2" class="form-control" aria-label="Section">
                                <option value="" disabled selected>Select Section</option>
                                <option value="Ruby">Ruby</option>
                                <option value="Sapphire">Sapphire</option>
                                <option value="Emerald">Emerald</option>
                                <option value="Topaz">Topaz</option>
                                <option value="Jade">Jade</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="actions">
                    <button type="button" py-click="adding_numbers" class="btn btn-gold">Check</button>
                    <button type="button" class="btn btn-clear" onclick="document.getElementById('output1').innerHTML='';">Clear</button>
                </div>
            </form>
        </div>

        <div class="card-footer">
            <div id="output1"></div>
        </div>
    </div>

    <script type="py" src="SW2Q3.py"></script>
</body>
</html>
